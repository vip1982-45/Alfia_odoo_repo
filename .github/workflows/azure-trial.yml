name: Azure trial

# Creates or updates the Alfia trial in Azure. It signs in with a federated identity (no password or
# secret is stored anywhere): Azure trusts only this repository's branch claude/alfia-hardening.
on:
  push:
    branches: [claude/alfia-hardening]
    paths: [deploy/azure/trial.env]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-trial
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Read settings
        id: cfg
        run: |
          grep -E '^[A-Z_]+=' deploy/azure/trial.env >> "$GITHUB_ENV"
          val() { grep -E "^$1=" deploy/azure/trial.env | head -1 | cut -d= -f2-; }
          if [ -z "$(val AZURE_CLIENT_ID)" ] || [ -z "$(val AZURE_TENANT_ID)" ] || [ -z "$(val AZURE_SUBSCRIPTION_ID)" ] || [ -z "$(val WEB_CIDRS)" ]; then
            echo "::notice::deploy/azure/trial.env is not filled in yet; nothing to do."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Show the identity GitHub presents to Azure
        run: |
          T=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "$T" | cut -d. -f2 | tr '_-' '/+' | python3 -c 'import base64,json,sys; s=sys.stdin.read().strip(); c=json.loads(base64.b64decode(s+"="*(-len(s)%4))); print("Subject:", c["sub"]); print("Issuer:", c["iss"])'

      # The runner's own Azure CLI runs on Python 3.14, where its background threads can deadlock while
      # loading modules ("_DeadlockError: requests.structures"). Use the CLI on Python 3.12 instead.
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'yes'
        with:
          python-version: '3.12'

      - name: Azure CLI on Python 3.12
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          python -m venv "$RUNNER_TEMP/azcli"
          "$RUNNER_TEMP/azcli/bin/pip" install -q azure-cli
          echo "$RUNNER_TEMP/azcli/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/azcli/bin/az" version -o tsv | head -1

      - name: Sign in to Azure
        if: steps.cfg.outputs.ready == 'yes'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Create the Azure resources
        if: steps.cfg.outputs.ready == 'yes'
        env:
          SUBSCRIPTION: ${{ env.AZURE_SUBSCRIPTION_ID }}
        run: bash deploy/azure/create-trial.sh

      - name: Install the system on the server
        if: steps.cfg.outputs.ready == 'yes'
        run: bash deploy/azure/install-on-vm.sh
